<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://zennvoi.com/" />

    <!-- Preload the hero background for a fast first paint (LCP). -->
    <link rel="preload" as="image" href="/images/hero-portrait.jpg" fetchpriority="high" />

    <title>Zenn Studio — Cinematic Editing, Sound Design &amp; Color</title>
    <meta
      name="description"
      content="Zenn Studio is the creative studio of Luis Alvero — cinematic video editing, sound design, and color grading. Building a portfolio of personal films and open for new collaborations."
    />
    <meta name="author" content="Luis Alvero" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zenn Studio" />
    <meta property="og:title" content="Zenn Studio — Cinematic Editing, Sound Design &amp; Color" />
    <meta
      property="og:description"
      content="The creative studio of Luis Alvero — cinematic editing, sound design, and color grading. Building a portfolio and open for new collaborations."
    />
    <meta property="og:url" content="https://zennvoi.com/" />
    <meta property="og:image" content="https://zennvoi.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zenn Studio — cinematic post-production" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zenn Studio — Cinematic Editing, Sound Design &amp; Color" />
    <meta
      name="twitter:description"
      content="Cinematic editing, sound design, and color grading by Luis Alvero. Building a portfolio and open for new collaborations."
    />
    <meta name="twitter:image" content="https://zennvoi.com/og-image.jpg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#000000" />

    <!-- Structured data: the studio + its founder -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Zenn Studio",
        "alternateName": "Zenn Studio — Post-Production",
        "description": "Cinematic video editing, sound design, and color grading by Luis Alvero.",
        "url": "https://zennvoi.com/",
        "image": "https://zennvoi.com/og-image.jpg",
        "founder": {
          "@type": "Person",
          "name": "Luis Alvero",
          "jobTitle": "Video Editor & Post-Production Artist"
        },
        "knowsAbout": [
          "Video Editing",
          "Sound Design",
          "Color Grading",
          "Motion Graphics",
          "Trailer Editing",
          "Game Cinematics"
        ],
        "areaServed": "Worldwide",
        "availableLanguage": ["English", "Spanish"]
      }
    </script>

    <!--
      GitHub Pages SPA routing fix (rafgraph/spa-github-pages).
      GitHub Pages has no server-side rewrite, so a hard refresh on a deep route
      (e.g. /portfolio/x) 404s. public/404.html encodes the path into a query
      string; this snippet decodes it back before React Router mounts.
      pathSegmentsToKeep = 0 because we serve from the domain root (zennvoi.com).
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
